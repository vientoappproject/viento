name: Build Android APK (VienTo)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Image Tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Android Tools & Cordova
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          npm install -g cordova

      - name: Build Cordova APK
        run: |
          cordova create app com.vientoappproject.clean VienTo --no-telemetry
          cp -r www/* app/www/
          cd app

          # Converte l'immagine caricata in un vero PNG quadrato 512x512
          IMG_FILE=$(ls www/*.{png,jpg,jpeg,webp} 2>/dev/null | head -n 1)
          if [ -n "$IMG_FILE" ]; then
            convert "$IMG_FILE" -resize 512x512! PNG32:www/icon.png
          fi

          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.vientoappproject.clean" version="1.0.2" xmlns="http://w3.org" xmlns:cdv="http://apache.org">
              <name>VienTo</name>
              <description>La Red Social Sana</description>
              <content src="index.html" />
              <access origin="*" />
              <allow-navigation href="*" />
              <preference name="scheme" value="https" />
              <preference name="hostname" value="localhost" />
              <preference name="LoadUrlTimeoutValue" value="70000" />
              <preference name="Orientation" value="portrait" />
          </widget>
          EOF

          cordova platform add android@13.0.0 --no-telemetry
          cordova prepare android --no-telemetry

          # Sostituisce direttamente le icone di sistema Android dopo prepare
          if [ -f "www/icon.png" ] && [ -d "platforms/android/app/src/main/res" ]; then
            find platforms/android/app/src/main/res/ -name "ic_launcher*.png" -exec cp www/icon.png {} \;
            find platforms/android/app/src/main/res/ -name "ic_launcher*.webp" -exec convert www/icon.png {} \;
          fi

          cordova build android --debug --no-telemetry -- --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viento-apk
          path: "**/app-debug.apk"
          if-no-files-found: error
