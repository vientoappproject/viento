name: Build Android APK (VienTo)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Android Tools & Cordova
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          npm install -g cordova

      - name: Build Cordova APK
        run: |
          cordova create app com.vientoappproject.app VienTo --no-telemetry
          cp -r www/* app/www/
          cd app
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.vientoappproject.app" version="1.0.0" xmlns="http://w3.org" xmlns:cdv="http://apache.org">
              <name>VienTo</name>
              <description>La Red Social Sana</description>
              <content src="index.html" />
              <access origin="*" />
              <allow-navigation href="*" />
              <preference name="LoadUrlTimeoutValue" value="70000" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
              <preference name="Orientation" value="portrait" />
          </widget>
          EOF
          cordova platform add android@14.0.1 --no-telemetry
          cordova build android --debug --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viento-apk
          path: "**/app-debug.apk"
          if-no-files-found: error
