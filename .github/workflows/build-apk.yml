              const SUPABASE_URL = "https://rqqeagjxgtpoypavzpds.supabase.co";
              const SUPABASE_ANON_KEY = "sb_publishable_awIlyqKMt7XGTapFfgqy2Q_lP4guXt2";
          </script>
          <nav class="nav-bar">
              <button class="nav-item active" onclick="switchTab('home')">🏠<br>Inicio</button>
              <button class="nav-item" onclick="switchTab('search')">🔍<br>Buscar</button>
              <button class="nav-item-center" onclick="switchTab('upload')">+</button>
              <button class="nav-item" onclick="switchTab('chat')">💬<br>Chat</button>
              <button class="nav-item" onclick="switchTab('profile')">👤<br>Perfil</button>
