150:       # 4. Compila l'applicazione nativa per smartphone Android
151:       cordova platform add android@12.0.0 --no-telemetry
152:       cordova build android --verbose --no-telemetry
153:       
154:       # 5. Sposta l'eseguibile pronto nella cartella di download
