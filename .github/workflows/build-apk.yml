                  .btn-secondary { background: #e4f0f6; color: #333; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; flex: 1; }
                  .upload-wrapper { padding: 20px; max-width: 500px; margin: 0 auto; background: white; min-height: 100%; }
