name: Build Android APK (VienTo)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          cordova create app com.vientoappproject.app VienTo --no-telemetry
          cp -r www/* app/www/
          cd app
          cordova platform add android --no-telemetry
          cordova build android --debug --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viento-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
